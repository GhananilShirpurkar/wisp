name: Feature request
description: Suggest an improvement to Wisp.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user experience and any alternatives.
    validations:
      required: true
