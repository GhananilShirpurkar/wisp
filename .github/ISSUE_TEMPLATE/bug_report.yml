name: Bug report
description: Report a reproducible problem with Wisp.
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distribution, desktop, X11/Wayland, Node version, and commit.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior. Redact screen content and secrets.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Do not attach .env, tokens, Temporal databases, or private screen content.
