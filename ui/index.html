<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Wisp · Your desktop companion</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="scene" aria-hidden="true"></div>
    <section id="companion" aria-label="Wisp desktop companion">
      <article id="bubble">
        <header>
          <span class="bubble-name"><span class="dot"></span> WISP</span
          ><button id="dismiss" class="icon-button" aria-label="Dismiss message">×</button>
        </header>
        <p id="speech" role="status" aria-live="polite">A little company for your next big idea.</p>
      </article>
      <button
        id="ghost"
        aria-label="Open companion controls"
        aria-expanded="false"
        aria-controls="controls"
      >
        <svg viewBox="0 0 140 155" aria-hidden="true">
          <defs>
            <linearGradient id="body" x2="0" y2="1">
              <stop stop-color="#fffdf3" />
              <stop offset="1" stop-color="#c1b7e8" />
            </linearGradient>
          </defs>
          <ellipse class="shadow" cx="70" cy="145" rx="36" ry="7" fill="#100c25" opacity=".22" />
          <path
            class="body"
            d="M25 123V62C25 1 115 1 115 62V123L100 113 85 128 70 114 55 128 40 113Z"
            fill="url(#body)"
          />
          <ellipse class="eye" cx="53" cy="64" rx="7" ry="10" />
          <ellipse class="eye" cx="87" cy="64" rx="7" ry="10" />
          <ellipse cx="44" cy="81" rx="9" ry="4" fill="#efb6c6" opacity=".65" />
          <ellipse cx="96" cy="81" rx="9" ry="4" fill="#efb6c6" opacity=".65" />
          <path
            d="M63 87Q70 94 77 87"
            fill="none"
            stroke="#51466d"
            stroke-width="3"
            stroke-linecap="round"
          /></svg
        ><span class="ghost-caption">YOUR DESKTOP SPIRIT</span>
      </button>
      <section id="controls" aria-label="Companion controls" hidden>
        <header class="panel-header">
          <div>
            <span class="eyebrow muted">YOUR COMPANION</span>
            <h1>Wisp<span class="version">01</span></h1>
          </div>
          <button id="close-panel" class="icon-button" aria-label="Close controls">×</button>
        </header>
        <div class="presence">
          <span class="dot"></span><span id="mode-label">Friendly spirit</span
          ><span id="sharing-badge">Sharing off</span>
        </div>
        <button id="share" class="share-card">
          <span class="share-icon"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="4" width="18" height="13" rx="3" />
              <path d="M8 21h8m-4-4v4m-3-10 3-3 3 3m-3-3v6" /></svg></span
          ><span
            ><strong>Screen sharing</strong
            ><small id="share-description">Choose what I can see</small></span
          ><span class="arrow" aria-hidden="true">↗</span>
        </button>
        <div class="settings">
          <button id="possess" class="setting" role="switch" aria-checked="false">
            <span
              ><strong>After-hours spirit</strong><small>A mischievous change of mood</small></span
            ><span class="switch" aria-hidden="true"></span></button
          ><button id="pin" class="setting" role="switch" aria-checked="false">
            <span><strong>Stay in place</strong><small>Keep your companion nearby</small></span
            ><span class="switch" aria-hidden="true"></span></button
          ><button id="motion" class="setting" role="switch" aria-checked="false">
            <span><strong>Quiet motion</strong><small>Less movement, no flashes</small></span
            ><span class="switch" aria-hidden="true"></span>
          </button>
        </div>
        <details id="effects">
          <summary>
            <span>Little hauntings</span
            ><span class="muted">5 effects <span aria-hidden="true">⌄</span></span>
          </summary>
          <div class="effects-grid">
            <button data-effect="splatter"><span aria-hidden="true">✳</span>Splatter</button
            ><button data-effect="lightning"><span aria-hidden="true">ϟ</span>Lightning</button
            ><button data-effect="shiver"><span aria-hidden="true">≈</span>Shiver</button
            ><button data-effect="candle"><span aria-hidden="true">♧</span>Candle</button
            ><button data-effect="ink"><span aria-hidden="true">◒</span>Ink</button>
          </div>
          <p id="effect-feedback" role="status" aria-live="polite"></p>
        </details>
        <footer class="panel-footer">
          <span><span class="dot"></span> Local companion</span
          ><button id="quit">Quit Wisp <span aria-hidden="true">↗</span></button>
        </footer>
      </section>
    </section>
    <script src="renderer.js"></script>
  </body>
</html>
